[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "garch-lab"
version = "0.1.0"
description = "Study: stylized facts of equity returns and GARCH(1,1) volatility forecasting, evaluated honestly out of sample."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scipy",
    "statsmodels",
    "arch>=7.2",
    "yfinance>=0.2.51",
]

# Install for development with:  pip install -e ".[dev]"
# requirements.txt is intentionally absent from the scaffold: it gets created
# on Sunday evening via `pip freeze > requirements.txt` as a pinned snapshot
# of the environment that actually produced the results.
[project.optional-dependencies]
dev = [
    "pytest",
    "jupyterlab",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
